<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>השוואת קבצי אקסל</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1d2330;
    --muted: #5f6b7d;
    --border: #d9dee6;
    --accent: #2457c5;
    --accent-text: #ffffff;
    --ext: #b4531a;
    --ext-soft: #fbeee5;
    --int: #1f7a4d;
    --int-soft: #e5f4ec;
    --error: #b42318;
    --error-soft: #fdecea;
    --row-alt: #f9fafb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c;
      --surface: #1d2128;
      --text: #e6e9ee;
      --muted: #9aa4b2;
      --border: #333a45;
      --accent: #6d97f0;
      --accent-text: #0e1420;
      --ext: #f0a070;
      --ext-soft: #3a2a20;
      --int: #6fcf9c;
      --int-soft: #1d3329;
      --error: #f59a92;
      --error-soft: #3b2120;
      --row-alt: #22262e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171c;
    --surface: #1d2128;
    --text: #e6e9ee;
    --muted: #9aa4b2;
    --border: #333a45;
    --accent: #6d97f0;
    --accent-text: #0e1420;
    --ext: #f0a070;
    --ext-soft: #3a2a20;
    --int: #6fcf9c;
    --int-soft: #1d3329;
    --error: #f59a92;
    --error-soft: #3b2120;
    --row-alt: #22262e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }

  .uploads { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { .uploads { grid-template-columns: 1fr; } }
  .drop {
    display: block;
    background: var(--surface);
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop.loaded { border-style: solid; }
  .drop.ext.loaded { border-color: var(--ext); }
  .drop.int.loaded { border-color: var(--int); }
  .drop input { display: none; }
  .drop .label { font-weight: 700; font-size: 1.1rem; }
  .drop.ext .label { color: var(--ext); }
  .drop.int .label { color: var(--int); }
  .drop .file { color: var(--muted); margin-top: 6px; word-break: break-all; }

  .actions { margin: 20px 0; display: flex; gap: 12px; flex-wrap: wrap; }
  button {
    font: inherit;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 10px 18px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 700; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .error {
    background: var(--error-soft);
    color: var(--error);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 16px;
    white-space: pre-line;
  }
  .hidden { display: none !important; }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .stat .n { font-size: 1.6rem; font-weight: 700; }
  .stat .t { color: var(--muted); font-size: .9rem; }
  .stat.ext .n { color: var(--ext); }
  .stat.int .n { color: var(--int); }

  section.result { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 24px; overflow: hidden; }
  .result header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; }
  .result.ext header { background: var(--ext-soft); }
  .result.int header { background: var(--int-soft); }
  .result h2 { margin: 0; font-size: 1.1rem; }
  .result.ext h2 { color: var(--ext); }
  .result.int h2 { color: var(--int); }
  .table-wrap { overflow-x: auto; max-height: 520px; }
  table { border-collapse: collapse; width: 100%; font-size: .92rem; }
  th, td { border-bottom: 1px solid var(--border); padding: 8px 10px; text-align: right; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--surface); }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  .empty { padding: 16px; color: var(--muted); }
  .note { color: var(--muted); font-size: .9rem; margin-top: -12px; margin-bottom: 20px; }
</style>
</head>
<body>
<main>
  <h1>השוואת קבצי אקסל לפי מספר פריט</h1>
  <p class="sub">מעלים קובץ חיצוני וקובץ פנימי, ומקבלים את השורות שקיימות רק באחד מהם. הקבצים נשארים במחשב שלך ולא נשלחים לשום מקום.</p>

  <div class="uploads">
    <label class="drop ext" id="drop-ext">
      <input type="file" id="file-ext" accept=".xlsx,.xls,.xlsm,.csv">
      <div class="label">קובץ חיצוני</div>
      <div class="file" id="name-ext">לחצי כאן או גררי קובץ לכאן</div>
    </label>
    <label class="drop int" id="drop-int">
      <input type="file" id="file-int" accept=".xlsx,.xls,.xlsm,.csv">
      <div class="label">קובץ פנימי</div>
      <div class="file" id="name-int">לחצי כאן או גררי קובץ לכאן</div>
    </label>
  </div>

  <div class="actions">
    <button class="primary" id="compare" disabled>השוואה</button>
    <button id="download-all" class="hidden">הורדת קובץ אחד עם שני הגיליונות</button>
  </div>

  <div class="error hidden" id="error"></div>

  <div id="results" class="hidden">
    <div class="summary" id="summary"></div>
    <p class="note hidden" id="note"></p>

    <section class="result ext">
      <header>
        <h2 id="title-ext">קיים בחיצוני ולא קיים בפנימי</h2>
        <button id="download-ext">הורדה לאקסל</button>
      </header>
      <div class="table-wrap" id="table-ext"></div>
    </section>

    <section class="result int">
      <header>
        <h2 id="title-int">קיים בפנימי ולא קיים בחיצוני</h2>
        <button id="download-int">הורדה לאקסל</button>
      </header>
      <div class="table-wrap" id="table-int"></div>
    </section>
  </div>
</main>

<script>
  const KEY_COLUMN = 'מספר פריט';

  const state = { ext: null, int: null, result: null };

  // Matching rules: ignore all whitespace, ignore letter case,
  // and drop zeros that come before the first letter ("0AB12" = "AB12").
  // Zeros after the letters are part of the number ("AB012" != "AB12").
  function normalizeKey(value) {
    return String(value ?? '')
      .replace(/\s+/g, '')
      .toLowerCase()
      .replace(/^0+(?=\D)/, '');
  }

  function cleanHeader(h) {
    return String(h ?? '').replace(/\s+/g, ' ').trim();
  }

  async function readWorkbook(file) {
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, { cellDates: true });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: true, blankrows: false });
    const text = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false, blankrows: false });
    if (!raw.length) throw new Error(`הקובץ "${file.name}" ריק.`);

    const headers = raw[0].map(cleanHeader);
    const keyIndex = headers.indexOf(KEY_COLUMN);
    if (keyIndex === -1) {
      throw new Error(`בקובץ "${file.name}" לא נמצאה עמודה בשם "${KEY_COLUMN}" בשורה הראשונה.\nהעמודות שנמצאו: ${headers.filter(Boolean).join(', ') || '(אין)'}`);
    }

    const rows = [];
    let emptyKeys = 0;
    for (let i = 1; i < raw.length; i++) {
      const key = normalizeKey(text[i][keyIndex]);
      if (!key) { emptyKeys++; continue; }
      rows.push({ key, raw: raw[i], text: text[i] });
    }
    return { name: file.name, headers: raw[0], rows, emptyKeys };
  }

  function rowsMissingFrom(source, other) {
    const otherKeys = new Set(other.rows.map(r => r.key));
    return source.rows.filter(r => !otherKeys.has(r.key));
  }

  function renderTable(container, headers, rows) {
    container.innerHTML = '';
    if (!rows.length) {
      const div = document.createElement('div');
      div.className = 'empty';
      div.textContent = 'אין שורות - כל הפריטים קיימים בשני הקבצים.';
      container.appendChild(div);
      return;
    }
    const table = document.createElement('table');
    const thead = table.createTHead().insertRow();
    headers.forEach(h => {
      const th = document.createElement('th');
      th.textContent = h;
      thead.appendChild(th);
    });
    const tbody = table.createTBody();
    rows.forEach(r => {
      const tr = tbody.insertRow();
      headers.forEach((_, i) => { tr.insertCell().textContent = r.text[i] ?? ''; });
    });
    container.appendChild(table);
  }

  function toSheet(headers, rows) {
    const sheet = XLSX.utils.aoa_to_sheet([headers, ...rows.map(r => r.raw)], { cellDates: true });
    sheet['!views'] = [{ RTL: true }];
    return sheet;
  }

  function download(filename, sheets) {
    const wb = XLSX.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] };
    sheets.forEach(([name, sheet]) => XLSX.utils.book_append_sheet(wb, sheet, name));
    XLSX.writeFile(wb, filename);
  }

  function showError(msg) {
    const el = document.getElementById('error');
    el.textContent = msg;
    el.classList.toggle('hidden', !msg);
  }

  function stat(cls, n, label) {
    return `<div class="stat ${cls}"><div class="n">${n}</div><div class="t">${label}</div></div>`;
  }

  function compare() {
    const { ext, int } = state;
    const onlyExt = rowsMissingFrom(ext, int);
    const onlyInt = rowsMissingFrom(int, ext);
    state.result = { onlyExt, onlyInt };

    document.getElementById('summary').innerHTML =
      stat('', ext.rows.length, 'שורות בקובץ החיצוני') +
      stat('', int.rows.length, 'שורות בקובץ הפנימי') +
      stat('ext', onlyExt.length, 'רק בחיצוני') +
      stat('int', onlyInt.length, 'רק בפנימי');

    const notes = [];
    if (ext.emptyKeys) notes.push(`${ext.emptyKeys} שורות בקובץ החיצוני בלי מספר פריט לא נכללו בהשוואה.`);
    if (int.emptyKeys) notes.push(`${int.emptyKeys} שורות בקובץ הפנימי בלי מספר פריט לא נכללו בהשוואה.`);
    const note = document.getElementById('note');
    note.textContent = notes.join(' ');
    note.classList.toggle('hidden', !notes.length);

    document.getElementById('title-ext').textContent = `קיים בחיצוני ולא קיים בפנימי (${onlyExt.length})`;
    document.getElementById('title-int').textContent = `קיים בפנימי ולא קיים בחיצוני (${onlyInt.length})`;
    renderTable(document.getElementById('table-ext'), ext.headers, onlyExt);
    renderTable(document.getElementById('table-int'), int.headers, onlyInt);

    document.getElementById('results').classList.remove('hidden');
    document.getElementById('download-all').classList.remove('hidden');
  }

  function setupUpload(which) {
    const input = document.getElementById(`file-${which}`);
    const drop = document.getElementById(`drop-${which}`);
    const nameEl = document.getElementById(`name-${which}`);

    async function load(file) {
      if (!file) return;
      showError('');
      state[which] = null;
      state.result = null;
      document.getElementById('results').classList.add('hidden');
      document.getElementById('download-all').classList.add('hidden');
      drop.classList.remove('loaded');
      nameEl.textContent = file.name;
      try {
        state[which] = await readWorkbook(file);
        drop.classList.add('loaded');
        nameEl.textContent = `${file.name} - ${state[which].rows.length} שורות`;
      } catch (e) {
        showError(e.message || `לא ניתן לקרוא את הקובץ "${file.name}".`);
      }
      document.getElementById('compare').disabled = !(state.ext && state.int);
    }

    input.addEventListener('change', () => load(input.files[0]));
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => {
      e.preventDefault();
      drop.classList.remove('over');
      load(e.dataTransfer.files[0]);
    });
  }

  setupUpload('ext');
  setupUpload('int');
  document.getElementById('compare').addEventListener('click', compare);
  document.getElementById('download-ext').addEventListener('click', () =>
    download('רק_בחיצוני.xlsx', [['רק בחיצוני', toSheet(state.ext.headers, state.result.onlyExt)]]));
  document.getElementById('download-int').addEventListener('click', () =>
    download('רק_בפנימי.xlsx', [['רק בפנימי', toSheet(state.int.headers, state.result.onlyInt)]]));
  document.getElementById('download-all').addEventListener('click', () =>
    download('תוצאות_השוואה.xlsx', [
      ['רק בחיצוני', toSheet(state.ext.headers, state.result.onlyExt)],
      ['רק בפנימי', toSheet(state.int.headers, state.result.onlyInt)],
    ]));

  if (typeof XLSX === 'undefined') {
    showError('לא הצלחתי לטעון את רכיב קריאת האקסל. יש לוודא חיבור לאינטרנט ולרענן את הדף.');
  }
</script>
</body>
</html>
